<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>红果TV · 网页复刻版（教学样本）</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">红果<span>TV</span> <em>网页复刻</em></div>
  <nav class="tabs">
    <button class="tab active" data-tab="home">首页</button>
    <button class="tab" data-tab="search">搜索</button>
    <button class="tab" data-tab="mine">我的</button>
  </nav>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜索影片 / 演员…" />
    <button id="searchBtn">搜索</button>
  </div>
</header>

<main id="view"><!-- 动态渲染 --></main>

<!-- 详情弹层 -->
<div id="detailModal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" id="detailClose">×</button>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- 播放器 -->
<div id="playerWrap" class="player-wrap hidden">
  <button class="player-close" id="playerClose">×</button>
  <video id="video" controls autoplay playsinline></video>
  <div class="danmaku-layer" id="danmakuLayer"></div>
  <div class="player-title" id="playerTitle"></div>
  <label class="dm-toggle"><input type="checkbox" id="dmToggle" checked /> 弹幕</label>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
